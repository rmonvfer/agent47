name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6

      - name: Check
        run: ./gradlew check
        env:
          CI: "true"

      - name: Validate installer
        run: bash -n scripts/install.sh

  build:
    name: Build dist (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: ubuntu-22.04-arm
            target: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6

      - name: Verify release version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(./gradlew properties --quiet | sed -n 's/^version: //p')"
          if [[ "$tag_version" != "$project_version" ]]; then
            echo "Tag version $tag_version does not match project version $project_version" >&2
            exit 1
          fi

      - name: Build distribution
        run: ./gradlew :agent47-app:jvmDistArchive -Pagent47.dist.target=${{ matrix.target }}
        env:
          CI: "true"

      - name: Stage archive
        run: cp agent47-app/build/distributions/agent47-${{ matrix.target }}.tar.gz .

      - name: Smoke test distribution
        shell: bash
        run: |
          dist_root="$RUNNER_TEMP/agent47-dist"
          mkdir -p "$dist_root"
          tar -xzf "agent47-${{ matrix.target }}.tar.gz" -C "$dist_root"
          binary="$dist_root/agent47/bin/agent47"
          test -x "$binary"
          "$binary" --help
          expected_version="agent47 ${GITHUB_REF_NAME#v}"
          actual_version="$("$binary" --version)"
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "Expected '$expected_version', got '$actual_version'" >&2
            exit 1
          fi
          extension_path="$PWD/examples/extensions/api-surface.kts"
          clean_home="$RUNNER_TEMP/agent47-smoke-home"
          mkdir -p "$clean_home"
          env -i HOME="$clean_home" AGENT47_DIR="$clean_home/.agent47" PATH=/usr/bin:/bin \
            "$binary" --no-extensions -e "$extension_path" --list-extensions \
            --extension-flag example=true \
            | grep -F "$extension_path"
          test ! -e "$clean_home/.agent47"
          repository_path="$RUNNER_TEMP/agent47-extension-repository"
          mkdir -p "$repository_path/extensions"
          cp "$extension_path" "$repository_path/extensions/api-surface.kts"
          git -C "$repository_path" init --initial-branch=main
          git -C "$repository_path" -c user.name=agent47 -c user.email=agent47@example.invalid \
            add extensions/api-surface.kts
          git -C "$repository_path" -c user.name=agent47 -c user.email=agent47@example.invalid \
            commit -m "Distribution extension smoke fixture"
          repository_source="file://$repository_path"
          env -i HOME="$clean_home" AGENT47_DIR="$clean_home/.agent47" PATH=/usr/bin:/bin \
            "$binary" install "$repository_source"
          env -i HOME="$clean_home" AGENT47_DIR="$clean_home/.agent47" PATH=/usr/bin:/bin \
            "$binary" --list-extensions \
            | grep -F "/extensions/api-surface.kts"
          env -i HOME="$clean_home" AGENT47_DIR="$clean_home/.agent47" PATH=/usr/bin:/bin \
            "$binary" update --extensions \
            | grep -F "already current"
          env -i HOME="$clean_home" AGENT47_DIR="$clean_home/.agent47" PATH=/usr/bin:/bin \
            "$binary" remove "$repository_source"
          python3 scripts/smoke-interactive.py "$binary"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent47-${{ matrix.target }}
          path: agent47-${{ matrix.target }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/agent47-*/; do
            cp "$dir"agent47-* release/
          done
          cd release
          sha256sum agent47-* > checksums-sha256.txt

      - name: Attest release assets
        uses: actions/attest-build-provenance@78e6cbd37d0ac1a40113c04f2037dacf1ea3f12e # v4
        with:
          subject-path: release/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: release/*
